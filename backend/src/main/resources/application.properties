server.port=8080
spring.application.name=oft-backend
spring.config.import=optional:file:./application-local.properties

# Configuración Base de Datos H2 In-Memory
spring.datasource.url=jdbc:h2:file:./data/oftappdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Swagger OpenAPI Config
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Proxy seguro hacia InsForge
# Configure estas variables en el entorno del servidor; nunca en el APK Android.
insforge.base-url=${INSFORGE_BASE_URL:}
insforge.api-key=${INSFORGE_API_KEY:}
